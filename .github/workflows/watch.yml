name: watch

on:
  schedule:
    # Every 30 minutes. GitHub delays scheduled runs under load, so treat
    # this as "roughly every 30 to 60 minutes", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Mark all currently open roles as seen without alerting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll boards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            python3 watch.py --seed
          else
            python3 watch.py
          fi

      - name: Commit state
        run: |
          git config user.name "ats-watch"
          git config user.email "actions@github.com"
          git add state/seen.json digest.md || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
