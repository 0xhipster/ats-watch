name: watch

on:
  schedule:
    # Every 30 minutes. GitHub delays scheduled runs under load, so treat
    # this as "roughly every 30 to 60 minutes", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Mark all currently open roles as seen without alerting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll boards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            python3 watch.py --seed
          else
            python3 watch.py
          fi

      - name: Commit state
        run: |
          git config user.name "ats-watch"
          git config user.email "actions@github.com"
          # Add only what exists. digest files are absent when nothing is new.
          git add -A state/ || true
          for f in digest.md digest_ats.md companies.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # The other lane commits on its own schedule, so the remote is often
          # ahead by the time we push. Rebase onto it and retry rather than
          # failing the whole run over a race we can simply wait out.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (remote moved). Retrying..."
            sleep 7
          done
          echo "Could not push state after 5 attempts."
          exit 1
