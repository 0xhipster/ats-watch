name: discover

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      recheck:
        description: "Re-resolve every company, not just unresolved ones"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve slugs
        run: |
          if [ "${{ inputs.recheck }}" = "true" ]; then
            python3 discover.py --recheck
          else
            python3 discover.py
          fi

      - name: Commit resolved companies
        run: |
          git config user.name "ats-watch"
          git config user.email "actions@github.com"
          git add companies.json
          git diff --staged --quiet || git commit -m "discover: resolve slugs"
          git push
